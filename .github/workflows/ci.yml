name: CI Pipeline

on:
  push:
    branches: [main, master, multi-page, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit

      - name: Run TypeScript Strict Check
        run: npm run type-check

  unit-and-smoke-tests:
    name: Unit & Route Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit

      - name: Execute Automated Test Suite
        run: npm test

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Audit Production Dependencies
        run: npm audit --audit-level=high --omit=dev || echo "Audit completed with advisory review needed"

  build:
    name: Next.js Production Build
    needs: [lint, typecheck, unit-and-smoke-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit || npm install --prefer-offline --no-audit

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"
          NEXT_PUBLIC_API_URL: "https://learnnova-taupe.vercel.app"
          BACKEND_URL: "https://learnnova-taupe.vercel.app"
          BETTER_AUTH_SECRET: "ci-dummy-secret-at-least-32-characters-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          NEON_AUTH_COOKIE_SECRET: "ci-dummy-cookie-secret-32-chars-long"
          INTERNAL_API_SECRET: "ci-dummy-internal-secret-32-chars-long"
          DATABASE_URL: "postgres://dummy:dummy@ep-dummy.ap-southeast-1.neon.tech/neondb?sslmode=require"

      - name: Upload Standalone Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-artifact
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 7

  pr-hygiene:
    name: PR Title & Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Conventional Commit Format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

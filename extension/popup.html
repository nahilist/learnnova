<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnnova AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5.2 4.5C6.3 4.5 7.2 5.4 7.2 6.5V11.8C7.2 14.5 9.4 16.7 12.1 16.7C13.2 16.7 14.1 17.6 14.1 18.7C14.1 19.8 13.2 20.7 12.1 20.7C7.2 20.7 3.2 16.7 3.2 11.8V6.5C3.2 5.4 4.1 4.5 5.2 4.5Z" />
            <path d="M18.8 3.3C19.9 3.3 20.8 4.2 20.8 5.3V12.7C20.8 13.8 19.9 14.7 18.8 14.7C17.7 14.7 16.8 13.8 16.8 12.7V5.3C16.8 4.2 17.7 3.3 18.8 3.3Z" />
          </svg>
        </div>
        <span class="logo-text">Learnnova AI</span>
      </div>
      <div class="status-badge" id="backend-status" title="Checking server status...">
        <span class="status-dot"></span>
        <span class="status-label">Connecting</span>
      </div>
    </header>

    <!-- Context Card -->
    <div class="context-card" id="context-card">
      <div class="context-pill" id="context-pill">
        <span id="context-pill-icon">🌐</span>
        <span id="context-pill-text">Current Webpage</span>
      </div>
      <h3 class="context-title" id="page-title">Loading active tab...</h3>
      <p class="context-url" id="page-url"></p>
    </div>

    <!-- Actions -->
    <div class="action-buttons">
      <button class="btn btn-primary" id="btn-open-sidepanel">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="15" y1="3" x2="15" y2="21"/>
        </svg>
        <span>Open in Side Panel</span>
      </button>

      <button class="btn btn-secondary" id="btn-quick-summarize">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span id="summarize-btn-text">⚡ Summarize Content</span>
      </button>

      <button class="btn btn-ghost" id="btn-open-webapp">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span>Launch Web Workspace</span>
      </button>
    </div>

    <!-- Footer with Settings Toggle -->
    <footer class="popup-footer">
      <span class="shortcut-tip">Shortcut: <code>Ctrl+Shift+L</code></span>
      <button class="settings-toggle" id="btn-toggle-settings" title="Settings">⚙️</button>
    </footer>

    <!-- Collapsible Settings Panel -->
    <div class="settings-drawer hidden" id="settings-drawer">
      <label class="settings-label" for="setting-api-url">Backend API Server</label>
      <input type="text" id="setting-api-url" class="settings-input" placeholder="http://13.196.187.230">
      <div class="settings-actions">
        <button class="btn-small btn-primary" id="btn-save-settings">Save</button>
        <button class="btn-small btn-secondary" id="btn-reset-settings">Reset</button>
      </div>
      <p class="settings-hint">Connected to AWS EC2: <code>http://13.196.187.230</code> (or your custom server).</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
